name: Build and deploy app to Azure Web App - reading-buddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # Setup Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build using your repo's Azure script
      - name: Build for Azure
        run: pnpm run build:azure
        env:
          NODE_ENV: production

      # Upload the correct deploy folder
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .
          
      - name: Debug files
        run: ls -R

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reading-buddy2'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E2038D3C85B3449A96D2B3926B339D5F }}
