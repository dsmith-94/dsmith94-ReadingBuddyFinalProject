name: Build and deploy Node.js app to Azure Web App
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm -r --if-present run build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: "/"
      - name: Prepare deployment package
        run: |
          mkdir -p deploy/artifacts/api-server
          mkdir -p deploy/artifacts/reading-buddy
          cp -r artifacts/api-server/dist deploy/artifacts/api-server/dist
          cp -r artifacts/reading-buddy/dist deploy/artifacts/reading-buddy/dist
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reading-buddy-hbegfyghd6hqhvff'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_096F11C2322B4586B4A1B7ABEC982A7F }}
          package: .
